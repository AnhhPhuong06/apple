<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f5f7fb"><title>Đăng nhập quản trị — AppSpace</title><link rel="icon" href="assets/app-default.svg"><link rel="stylesheet" href="appstore.css"><link rel="stylesheet" href="admin-login.css"><script src="shared.js" defer></script><script src="admin-login.js" defer></script></head>
<body class="login-body"><header class="login-header"><a class="brand" href="index.html"><span class="brand-mark" data-icon="grid"></span>AppSpace</a><a href="index.html" class="text-button">Trang ứng dụng <span data-icon="arrow"></span></a></header>
<main class="login-main"><section class="login-card" aria-labelledby="login-title"><div class="login-symbol"><span data-icon="shield"></span></div><p class="login-eyebrow">KHÔNG GIAN QUẢN TRỊ</p><h1 id="login-title">Chào mừng trở lại.</h1><p class="login-description">Đăng nhập để ký ứng dụng và quản lý<br>trang cài đặt của bạn.</p>
<form id="login-form"><label for="admin-password">Mật khẩu quản trị</label><div class="login-password"><input id="admin-password" name="password" type="password" autocomplete="current-password" required maxlength="1024" placeholder="Nhập mật khẩu của bạn"><button type="button" id="toggle-password" aria-pressed="false">Hiện</button></div><p class="login-error" id="login-error" role="alert" hidden></p><button id="login-submit" class="login-submit">Đăng nhập <span data-icon="arrow"></span></button></form>
<div class="login-note"><span data-icon="lock"></span>Phiên quản trị riêng tư của bạn.</div></section><p class="login-footer">AppSpace · Không gian ứng dụng của bạn</p></main></body></html>
